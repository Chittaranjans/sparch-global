<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #6366f1;
            color: white;
            border: none;
            cursor: pointer;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Parameter Extraction Test</h1>
    <input type="text" id="testQuery" value="I want jobs at TechCorp" placeholder="Enter test query">
    <button onclick="testExtraction()">Test Extraction</button>
    
    <h3>Result:</h3>
    <pre id="result"></pre>

    <h3>Test Cases:</h3>
    <ul>
        <li><button onclick="testCase('Show me jobs at TechCorp')">Show me jobs at TechCorp</button></li>
        <li><button onclick="testCase('I want techcorp jobs')">I want techcorp jobs</button></li>
        <li><button onclick="testCase('Jobs for TechCorp Inc')">Jobs for TechCorp Inc</button></li>
        <li><button onclick="testCase('software engineer at techcorp')">software engineer at techcorp</button></li>
    </ul>

    <script>
        const companies = [
            "AI Innovations",
            "AppMakers Co",
            "BigData Corp",
            "CloudTech Solutions",
            "DataFlow Systems",
            "DesignStudio",
            "Innovation Labs",
            "QualityFirst",
            "StartupHub",
            "TechCorp Inc.",
            "WebSolutions Ltd"
        ];

        function extractSearchParameters(query) {
            const params = {
                keyword: '',
                location: '',
                company: '',
                minSalary: null,
                currency: 'USD'
            };

            const lowerQuery = query.toLowerCase();

            // Extract role/keyword
            const roleKeywords = ['software engineer', 'developer', 'frontend', 'backend', 'full stack', 
                                 'fullstack', 'devops', 'data scientist', 'designer', 'engineer', 
                                 'manager', 'analyst', 'machine learning', 'ml engineer'];
            
            for (const role of roleKeywords) {
                if (lowerQuery.includes(role)) {
                    params.keyword = role;
                    break;
                }
            }

            // Extract location
            const locationMatch = lowerQuery.match(/\b(?:in|at|from|near)\s+([a-z\s,]+?)(?:\s+(?:with|for|at|paying|making|company|\.|$))/i);
            if (locationMatch) {
                params.location = locationMatch[1].trim();
            }

            // Extract company - improved to handle lowercase and various patterns
            // Pattern 1: "at/for/with COMPANY"
            const companyMatch1 = lowerQuery.match(/\b(?:at|for|with|from)\s+([a-z][a-z\s&.]+?)(?:\s+(?:in|paying|making|company|jobs?|\.|$))/i);
            if (companyMatch1) {
                const potentialCompany = companyMatch1[1].trim();
                // Check if it matches a known company (case insensitive)
                const matchedCompany = companies.find(c => c.toLowerCase().includes(potentialCompany.toLowerCase()));
                if (matchedCompany) {
                    params.company = matchedCompany;
                }
            }
            
            // Pattern 2: Direct company name mention (if not found above)
            if (!params.company) {
                for (const company of companies) {
                    if (lowerQuery.includes(company.toLowerCase())) {
                        params.company = company;
                        break;
                    }
                }
            }

            return params;
        }

        function testExtraction() {
            const query = document.getElementById('testQuery').value;
            const params = extractSearchParameters(query);
            document.getElementById('result').textContent = JSON.stringify(params, null, 2);
        }

        function testCase(query) {
            document.getElementById('testQuery').value = query;
            testExtraction();
        }

        // Auto-test on load
        testExtraction();
    </script>
</body>
</html>
